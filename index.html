<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>中国教育考考网｜模拟成绩报告演示</title>
<meta name="description" content="虚构的可编辑成绩报告网页演示，非官方网站。">
<style>
:root{--accent:#1778bd;--radius:16px;--shadow:14px;--card-width:92%;color-scheme:light}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;color:#17212a;background:#dce4e9}button,input{font:inherit}button{cursor:pointer}.studio{min-height:100vh;display:grid;grid-template-columns:minmax(390px,1fr) 390px;background:radial-gradient(circle at 30% 10%,#f8fbfc,#e7eef2 42%,#ced8df)}.preview{padding:28px;display:grid;place-items:start center}.phone{position:relative;width:min(430px,100%);min-height:920px;overflow:hidden;background:#f8f8fa;border:8px solid #19242d;border-radius:38px;box-shadow:0 22px 65px #1d313e38}.status{height:42px;padding:14px 22px 5px;display:flex;justify-content:space-between;font-size:14px}.browser-head{height:112px;background:#f1f1f2;border-bottom:1px solid #e8e8e9}.browser-row{height:70px;display:grid;grid-template-columns:56px 1fr 56px;align-items:center;text-align:center}.browser-row strong{display:block;font-size:21px;font-weight:500;letter-spacing:.02em}.browser-row small{display:block;color:#777d82;font-size:13px;margin-top:2px;letter-spacing:.02em}.plain{border:0;background:transparent}.close{font-size:38px;font-weight:200}.more{font-size:20px}.landing{text-align:center;padding:66px 26px 0}.mark{margin:auto;width:82px;height:82px;border-radius:50%;display:grid;place-items:center;align-content:center;color:#fff;background:radial-gradient(circle at 35% 30%,#2494c8,#084d7c 72%);border:4px double #ffffffd9;box-shadow:inset 0 0 0 3px #0a5a8e}.mark b{font-size:13px;letter-spacing:.06em}.mark i{font-size:16px;font-style:normal;border-top:1px solid #ffffffa8}.mark.small{width:28px;height:28px;border-width:2px;box-shadow:none;margin:0}.mark.small b{font-size:6px}.mark.small i{font-size:7px}.landing p{margin:72px auto 58px;color:#989da1;max-width:365px;font-size:17px;line-height:1.55;letter-spacing:.015em}.launch{min-width:116px;padding:9px 18px;border:1px solid #717579;border-radius:3px;background:#fbfbfc;color:#1b1d1f;font-size:17px;line-height:1.2}.mountains{position:absolute;left:0;right:0;bottom:42px;height:205px;opacity:.10;overflow:hidden}.mountains i{position:absolute;width:155px;height:155px;transform:rotate(45deg);border:8px solid #aeb7bc;bottom:-92px}.mountains i:nth-child(1){left:-18px}.mountains i:nth-child(2){left:115px;width:190px;height:190px;bottom:-98px}.mountains i:nth-child(3){right:-20px}.notice{position:absolute;z-index:8;bottom:0;left:0;right:0;padding:7px;background:#f0f1f2;color:#6f767b;text-align:center;font-size:10px;font-weight:700;letter-spacing:.04em}.modal-layer{position:absolute;inset:0;z-index:6;background:#00000094;display:flex;align-items:center;justify-content:center;padding:32px}.web-modal{width:100%;background:#fff;border-radius:20px;padding:28px 26px 22px;box-shadow:0 18px 50px #0004}.label{display:inline-block;padding:4px 8px;border-radius:4px;background:#fff0c2;color:#725a13;font-size:11px;font-weight:700}.web-modal h2{margin:16px 0 10px;font-size:23px;line-height:1.45}.web-modal p{color:#727a80;font-size:13px;margin:0 0 32px}.actions{display:flex;justify-content:flex-end;gap:26px}.actions button{border:0;background:transparent;font-weight:700;padding:8px 4px}.actions .primary{color:#3c628e}.report-page{min-height:100%;padding-bottom:55px;background:#fff}.report-head{height:106px;color:#fff;background:linear-gradient(135deg,#064b80,var(--accent))}.mini-bar{height:58px;display:grid;grid-template-columns:42px 1fr 42px;align-items:center;padding:2px 10px 8px}.mini-bar>button{border:0;background:transparent;color:#fff;font-size:39px}.mini-bar>div{height:42px;border-radius:22px;padding:0 12px;background:#12161cdb;display:flex;align-items:center;gap:8px;font-size:15px;white-space:nowrap;overflow:hidden}.mini-bar>i{width:34px;height:34px;background:#12161cdb;border-radius:50%;display:grid;place-items:center;font-style:normal}.title{text-align:center;padding:22px 12px 14px}.title span{display:inline-block;padding:4px 10px;background:#fff1b8;color:#72530b;border-radius:20px;font-size:10px;font-weight:800}.title h1{margin:10px 0 0;font-size:23px;line-height:1.6;color:#111}.ribbon{width:42%;min-width:160px;padding:6px 20px 7px 32px;border-radius:0 24px 24px 0;color:#fff;background:linear-gradient(90deg,#676de2,#51abed);font-size:17px}.portrait{margin:12px auto 14px;position:relative;width:112px;height:142px;background:#218bcc;overflow:hidden;display:flex;justify-content:center;align-items:flex-end}.hair{position:absolute;width:72px;height:84px;top:12px;border-radius:50% 50% 42% 42%;background:#313741}.face{z-index:1;width:54px;height:66px;margin-bottom:38px;padding-top:17px;border-radius:44%;background:#f0c9b8;text-align:center;color:#563f3bb3;font-size:10px}.portrait:after{content:"虚构演示头像";position:absolute;left:0;right:0;bottom:0;padding:5px;background:#102537bf;color:#fff;text-align:center;font-size:9px}.card{position:relative;width:var(--card-width);margin:auto;padding:4px 14px 10px;background:#fff;border:1px solid #e6eaed;border-radius:var(--radius);box-shadow:0 4px var(--shadow) #142a3a29;overflow:hidden}.watermark{position:absolute;top:35%;left:3%;right:3%;transform:rotate(-18deg);font-size:74px;font-weight:900;letter-spacing:.12em;color:#1778bd14;text-align:center}.row{position:relative;z-index:1;min-height:46px;display:grid;grid-template-columns:42% 58%;align-items:center;border-bottom:1px solid #d9dde0;font-size:15px}.row b{color:#6b7379;font-weight:400;text-align:right;overflow-wrap:anywhere}.row b.total{font-weight:700;color:var(--accent)}.row.indent span{padding-left:18%;white-space:nowrap}.warning{width:var(--card-width);margin:10px auto;color:#b25430;font-size:11px}.foot{width:86%;margin:18px auto 0;color:#80878c;text-align:center;font-size:10px;line-height:1.6}.editor{height:100vh;overflow-y:auto;padding:28px 26px 40px;background:#fafcfd;box-shadow:-16px 0 40px #2a3d4914}.editor-head{display:flex;justify-content:space-between}.editor-head span{color:#1680ad;font-size:11px;font-weight:800}.editor-head h2{margin:3px 0;font-size:25px}.editor-head button{border:0;background:transparent;font-size:28px}.intro{color:#68757d;font-size:12px;line-height:1.6}.section{margin-top:20px;padding-top:16px;border-top:1px solid #dfe6ea}.section h3{font-size:14px}.section label{display:block;margin-bottom:10px;color:#56636b;font-size:11px;font-weight:700}.section input[type=text],.section input[type=number]{width:100%;height:38px;margin-top:5px;padding:0 10px;border:1px solid #cfdae0;border-radius:8px;background:#fff}.section input[type=color]{display:block;width:100%;height:36px;margin-top:5px}.section input[type=range]{width:100%;accent-color:#1680ad}.range-title{display:flex;justify-content:space-between}.score-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.editor-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px}.editor-actions button{min-height:40px;border:1px solid #c9d5db;border-radius:9px;background:#fff;font-size:12px;font-weight:700}.editor-actions .save{color:#126d8f;border-color:#1b85ad}.editor-actions .preview-btn{grid-column:1/-1;background:#187ba0;color:#fff;border-color:#187ba0}.floating{display:none}
@media(max-width:880px){.studio{display:block}.preview{padding:0}.phone{width:100%;min-height:100vh;border:0;border-radius:0;box-shadow:none}.floating{display:block;position:fixed;z-index:20;right:14px;bottom:42px;padding:10px 14px;border:0;border-radius:24px;background:#172d39;color:#fff;box-shadow:0 8px 22px #0003;font-size:12px;font-weight:700}.editor{position:fixed;z-index:30;inset:0 0 0 auto;width:min(390px,94vw);transform:translateX(105%);transition:.25s}.editor.open{transform:translateX(0)}}@media(min-width:881px){.editor{display:block!important}}
.landing-logo{display:block;margin:auto;width:82px;height:82px;border-radius:50%;object-fit:cover;object-position:center;border:4px solid #fff;box-shadow:0 3px 12px #17384f38}
</style>
</head>
<body>
<main class="studio">
<section class="preview"><div class="phone" id="phone">
<div id="landing">
<header class="browser-head"><div class="status"><strong>20:42</strong><span>◉ ◐ ▮▮▮</span></div><div class="browser-row"><button class="plain close">×</button><div><strong>中国教育考考网</strong><small>静态网页演示</small></div><button class="plain more">•••</button></div></header>
<div class="landing"><img class="landing-logo" src="home-icon.png" alt="首页图标"><p>请使用“中国教育考考网”网页演示功能，<br>查看模拟成绩报告。</p><button class="launch" id="launch">打开演示</button></div>
<div class="mountains"><i></i><i></i><i></i></div><div class="notice">演示页面 · 非官方网站 · 非微信系统窗口</div></div>
<div id="report" hidden></div><div id="modal" hidden></div></div></section>
<button class="floating" id="floating">编辑内容与外观</button>
<aside class="editor" id="editor"><div class="editor-head"><div><span>本地编辑器</span><h2>内容与外观</h2></div><button id="editorClose">×</button></div><p class="intro">修改会实时显示；保存的数据只留在这台设备的浏览器中。</p><div class="section"><h3>报告信息</h3><div id="textFields"></div><div class="score-grid" id="scoreFields"></div></div>
<div class="section"><h3>方框设计</h3><label>主题颜色<input type="color" id="accent"></label><label><span class="range-title">方框宽度 <b id="widthVal"></b></span><input type="range" id="cardWidth" min="82" max="96"></label><label><span class="range-title">圆角大小 <b id="radiusVal"></b></span><input type="range" id="radius" min="0" max="30"></label><label><span class="range-title">阴影强度 <b id="shadowVal"></b></span><input type="range" id="shadow" min="0" max="30"></label></div>
<div class="editor-actions"><button id="reset">恢复默认</button><button class="save" id="save">保存到本机</button><button class="preview-btn" id="showReport">查看报告</button></div></aside>
</main>
<script>
const defaults={name:"林晓晴",idNumber:"110101********2048",school:"启明示例大学",department:"公共管理学院",examNumber:"DEMO20260824001",examDate:"2026年6月",total:498,listening:177,reading:193,writing:128,accent:"#1778bd",cardWidth:92,radius:16,shadow:14};
let state={...defaults};try{state={...state,...JSON.parse(localStorage.getItem("kaokao-demo-settings")||"{}")}}catch(e){}
const labels={name:"姓名",idNumber:"脱敏身份证号",school:"学校",department:"院系",examNumber:"演示编号",examDate:"考试时间",total:"总分",listening:"听力",reading:"阅读",writing:"写作翻译"};
const textKeys=["name","idNumber","school","department","examNumber","examDate"],scoreKeys=["total","listening","reading","writing"];
const mark=s=>'<div class="mark '+(s?'small':'')+'"><b>DEMO</b><i>考考</i></div>';
function fields(){textFields.innerHTML=textKeys.map(k=>'<label>'+labels[k]+'<input type="text" data-key="'+k+'" value="'+state[k]+'"></label>').join("");scoreFields.innerHTML=scoreKeys.map(k=>'<label>'+labels[k]+'<input type="number" data-key="'+k+'" value="'+state[k]+'"></label>').join("");document.querySelectorAll("[data-key]").forEach(el=>el.oninput=e=>{state[e.target.dataset.key]=e.target.type==="number"?Number(e.target.value):e.target.value;renderReport()});accent.value=state.accent;cardWidth.value=state.cardWidth;radius.value=state.radius;shadow.value=state.shadow;styleUpdate()}
function row(l,v,c=""){return '<div class="row '+c+'"><span>'+l+'</span><b class="'+(l==="总　　分"?"total":"")+'">'+v+'</b></div>'}
function renderReport(){report.innerHTML='<div class="report-page"><header class="report-head"><div class="status"><strong>20:42</strong><span>◉ ◐ ▮▮▮</span></div><div class="mini-bar"><button id="back">‹</button><div>'+mark(true)+'<span>中国教育考考网 · 演示服务</span></div><i>◎</i></div></header><div class="title"><span>演示页面 · 非官方网站</span><h1>全国大学英语六级考试<br>模拟成绩报告单</h1></div><div class="ribbon">核验信息 · DEMO</div><div class="portrait"><div class="hair"></div><div class="face">示例<br>头像</div></div><section class="card"><div class="watermark">DEMO</div>'+row("姓　　名",state.name)+row("身份证号",state.idNumber)+row("学　　校",state.school)+row("院　　系",state.department)+row("准考证号",state.examNumber)+row("考试时间",state.examDate)+row("总　　分",state.total)+row("听力 (35%)",state.listening,"indent")+row("阅读 (35%)",state.reading,"indent")+row("写作和翻译 (30%)",state.writing,"indent")+row("口试准考证号","--")+row("口试等级","--")+'</section>'+((state.listening+state.reading+state.writing!==Number(state.total))?'<p class="warning">提示：三项分数之和与总分不一致</p>':'')+'<p class="foot">本页面仅用于网页设计与交互演示，不提供真实成绩核验服务。</p></div>';let b=document.getElementById("back");if(b)b.onclick=showLanding}
function styleUpdate(){document.documentElement.style.setProperty("--accent",state.accent);document.documentElement.style.setProperty("--card-width",state.cardWidth+"%");document.documentElement.style.setProperty("--radius",state.radius+"px");document.documentElement.style.setProperty("--shadow",state.shadow+"px");widthVal.textContent=state.cardWidth+"%";radiusVal.textContent=state.radius+"px";shadowVal.textContent=state.shadow}
function showLanding(){landing.hidden=false;report.hidden=true}function showReport(){renderReport();landing.hidden=true;report.hidden=false;editor.classList.remove("open")}function showModal(){modal.hidden=false;modal.innerHTML='<div class="modal-layer"><div class="web-modal"><span class="label">网页模拟窗口</span><h2>即将打开“中国教育考考网”演示报告</h2><p>这是网页内的交互演示，不是微信系统提示。</p><div class="actions"><button id="cancel">取消</button><button class="primary" id="openDemo">打开演示</button></div></div></div>';cancel.onclick=()=>modal.hidden=true;openDemo.onclick=()=>{modal.hidden=true;showReport()}}
launch.onclick=showModal;floating.onclick=()=>editor.classList.toggle("open");editorClose.onclick=()=>editor.classList.remove("open");showReport.onclick=showReport;save.onclick=()=>{localStorage.setItem("kaokao-demo-settings",JSON.stringify(state));save.textContent="已保存 ✓";setTimeout(()=>save.textContent="保存到本机",1200)};reset.onclick=()=>{state={...defaults};localStorage.removeItem("kaokao-demo-settings");fields();renderReport()};["accent","cardWidth","radius","shadow"].forEach(id=>document.getElementById(id).oninput=e=>{state[id]=e.target.type==="range"?Number(e.target.value):e.target.value;styleUpdate()});fields();renderReport();
</script>
</body></html>
